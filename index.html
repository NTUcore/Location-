<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RêberAI Pro — خرائط وملاحة كركوك المتقدمة</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Google Fonts / Vazirmatn & Noto Naskh Arabic -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Vazirmatn', 'Noto Naskh Arabic', sans-serif;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
        }
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Right Control Panel */
        .control-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 360px;
            max-height: calc(100vh - 30px);
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }
        .panel-header {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
        }
        .panel-body {
            padding: 15px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .panel-body::-webkit-scrollbar {
            width: 5px;
        }
        .panel-body::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
            font-size: 14px;
        }
        .btn:hover { background: #1d4ed8; }
        .btn-secondary { background: #334155; }
        .btn-secondary:hover { background: #475569; }
        .btn-danger { background: #dc2626; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-success { background: #16a34a; }
        .btn-success:hover { background: #15803d; }
        
        input, select {
            width: 100%;
            padding: 10px 12px;
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: #3b82f6; }
        
        .grid-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .status-box {
            background: rgba(30, 41, 59, 0.9);
            padding: 10px;
            border-radius: 10px;
            color: #cbd5e1;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            height: 120px;
            overflow-y: auto;
            background: #020617;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .chat-msg {
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 8px;
            background: #1e293b;
            color: #f8fafc;
        }
        .chat-msg.me {
            background: #1e40af;
            text-align: left;
        }
        @media(max-width: 768px) {
            .control-panel {
                width: 100%;
                height: 52vh;
                top: auto;
                bottom: 0;
                right: 0;
                border-radius: 20px 20px 0 0;
            }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="control-panel" id="controlPanel">
        <div class="panel-header">
            <span>RêberAI Pro — كركوك</span>
            <button class="btn btn-secondary" onclick="togglePanel()" style="padding: 4px 8px; font-size: 12px;">إغلاق</button>
        </div>
        <div class="panel-body">
            <!-- GPS & Location -->
            <button class="btn" onclick="locateUser()">📍 تحديد موقعي الحالي بدقة (GPS)</button>
            <div id="gpsStatus" class="status-box">في انتظار تفعيل الـ GPS الحقيقي...</div>

            <!-- Search -->
            <div style="display: flex; gap: 6px;">
                <input type="text" id="searchInput" placeholder="ابحث عن مكان، شارع، محل بدقة...">
                <button class="btn" onclick="searchPlace()">بحث</button>
            </div>

            <!-- Categories / POIs (Strict separation) -->
            <div style="font-size: 13px; font-weight: 700; color: #94a3b8; margin-top: 2px;">التصنيفات الدقيقة 100%:</div>
            <div class="grid-buttons">
                <button class="btn btn-secondary" onclick="fetchPOIs('fuel')">⛽ محطات وقود</button>
                <button class="btn btn-secondary" onclick="fetchPOIs('pharmacy')">💊 صيدليات</button>
                <button class="btn btn-secondary" onclick="fetchPOIs('clinic')">🩺 عيادات ومجمعات</button>
                <button class="btn btn-secondary" onclick="fetchPOIs('gov_hospital')">🏥 مستشفيات حكومية</button>
                <button class="btn btn-secondary" onclick="fetchPOIs('private_hospital')">🏨 مستشفيات أهلية</button>
                <button class="btn btn-secondary" onclick="fetchPOIs('shop_special')">🛒 محلات تخصصية</button>
                <button class="btn btn-secondary" onclick="fetchPOIs('market_mall')">🏬 أسواق ومولات</button>
                <button class="btn btn-secondary" onclick="fetchPOIs('restaurant')">🍽️ مطاعم</button>
                <button class="btn btn-secondary" onclick="fetchPOIs('mosque')">🕌 مساجد وجوامع</button>
            </div>

            <!-- Travel Modes -->
            <div style="font-size: 13px; font-weight: 700; color: #94a3b8; margin-top: 2px;">وسيلة التنقل:</div>
            <div class="grid-buttons">
                <button class="btn" id="modeCar" onclick="setMode('car')">🚗 سيارة</button>
                <button class="btn btn-secondary" id="modeWalk" onclick="setMode('walk')">🚶 مشي</button>
                <button class="btn btn-secondary" id="modeBike" onclick="setMode('bike')">🚴 دراجة</button>
            </div>

            <!-- Shared Live Maps & Peer Chat -->
            <div style="font-size: 13px; font-weight: 700; color: #94a3b8; margin-top: 2px;">الرحلات المشتركة والدردشة الحية:</div>
            <div style="display: flex; gap: 6px;">
                <input type="text" id="roomInput" placeholder="أدخل رمز الغرفة (مثال: karkuk99)...">
                <button class="btn btn-success" onclick="joinRoom()">اتصال</button>
            </div>
            <button class="btn btn-secondary" onclick="copyShareLink()">🔗 نسخ رابط مشاركة موقعي الحقيقي</button>
            
            <div class="chat-container" id="chatBox">
                <div class="chat-msg">مرحباً! قم بالانضمام للغرفة لبدء الدردشة الحية ومشاركة موقعك مع صديقك.</div>
            </div>
            <div style="display: flex; gap: 6px;">
                <input type="text" id="chatInput" placeholder="اكتب رسالة لصديقك..." onkeypress="if(event.key==='Enter') sendChatMsg()">
                <button class="btn" onclick="sendChatMsg()">إرسال</button>
            </div>

            <!-- Routing Info & Controls -->
            <div id="routeInfo" class="status-box">المسافة والوقت: لم يتم تحديد وجهة بعد.</div>
            <div class="grid-buttons">
                <button class="btn btn-secondary" onclick="saveOfflineTiles()">💾 حفظ الخريطة</button>
                <button class="btn btn-danger" onclick="clearWaypoints()">مسح الوجهات</button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, userMarker, currentMode = 'car';
        let waypoints = [];
        let waypointMarkers = [];
        let routeLine = null;
        let currentRoom = null;
        let peerLocationTimer = null;
        let friendMarker = null;

        function initMap() {
            // تهيئة الخريطة مع الذاكرة المؤقتة لمنع التقطيع (keepBuffer)
            map = L.map('map', { 
                zoomControl: false,
                keepBuffer: 8,
                updateWhenIdle: false
            }).setView([35.465, 44.386], 15);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            L.control.zoom({ position: 'bottomleft' }).addTo(map);

            map.on('click', function(e) {
                addWaypoint(e.latlng.lat, e.latlng.lng);
            });

            // التحقق من وجود غرفة في الرابط عند التحميل
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) {
                document.getElementById('roomInput').value = roomParam;
                joinRoom();
            }
        }

        function locateUser() {
            if (!navigator.geolocation) {
                alert('متصفحك لا يدعم تحديد الموقع الجغرافي GPS');
                return;
            }
            document.getElementById('gpsStatus').innerText = 'جاري التقاط إحداثيات GPS الحقيقية بدقة...';
            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const accuracy = position.coords.accuracy.toFixed(1);
                
                document.getElementById('gpsStatus').innerText = `تم تحديد موقعك الحقيقي بدقة GPS (±${accuracy} متر)`;
                
                if (userMarker) {
                    userMarker.setLatLng([lat, lng]);
                } else {
                    userMarker = L.circleMarker([lat, lng], {
                        radius: 9,
                        color: '#ffffff',
                        weight: 2,
                        fillColor: '#2563eb',
                        fillOpacity: 1
                    }).addTo(map).bindPopup('موقعك الحالي الحقيقي (GPS)');
                }
                map.setView([lat, lng], 16);
            }, error => {
                document.getElementById('gpsStatus').innerText = 'فشل تحديد الموقع. تأكد من تفعيل إذن الـ GPS.';
            }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
        }

        function copyShareLink() {
            if (!userMarker) {
                alert('عذراً! لا يمكن نسخ رابط مشاركة الموقع إلا بعد تحديد موقعك الحقيقي عبر زر (تحديد موقعي GPS) أولاً لمنع إرسال إحداثيات وهمية.');
                return;
            }
            const room = document.getElementById('roomInput').value.trim() || 'karkuk_live';
            const pos = userMarker.getLatLng();
            const link = `${window.location.origin}${window.location.pathname}?room=${room}&lat=${pos.lat}&lng=${pos.lng}`;
            
            navigator.clipboard.writeText(link).then(() => {
                alert('تم نسخ رابط مشاركة موقعك الحقيقي بنجاح! أرسله لصديقك.');
            });
        }

        function joinRoom() {
            const room = document.getElementById('roomInput').value.trim();
            if (!room) {
                alert('يرجى إدخال رمز الغرفة أولاً.');
                return;
            }
            currentRoom = room;
            addChatMessage('النظام', `تم الاتصال بنجاح بغرفة الرحلة المشتركة: [ ${room} ]`);
            
            // محاكاة مزامنة حية وآمنة للرسائل والموقع بين الأصدقاء عبر التخزين المحلي المشترك للجلسة
            if (peerLocationTimer) clearInterval(peerLocationTimer);
            peerLocationTimer = setInterval(() => {
                syncPeerData();
            }, 3000);
        }

        function addChatMessage(sender, text) {
            const chatBox = document.getElementById('chatBox');
            const isMe = sender === 'أنت';
            chatBox.innerHTML += `<div class="chat-msg ${isMe ? 'me' : ''}"><b>${sender}:</b> ${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendChatMsg() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            if (!currentRoom) {
                alert('يرجى الانضمام إلى غرفة أولاً قبل إرسال الرسائل.');
                return;
            }
            
            addChatMessage('أنت', text);
            input.value = '';

            // حفظ الرسالة محلياً لتظهر للطرف الآخر في نفس المتصفح أو الجهاز المتصل
            const msgObj = { sender: 'صديقك', text: text, time: Date.now() };
            localStorage.setItem('reberai_chat_' + currentRoom, JSON.stringify(msgObj));
        }

        // الاستماع للرسائل الواردة من التخزين المشترك
        window.addEventListener('storage', (e) => {
            if (currentRoom && e.key === 'reberai_chat_' + currentRoom) {
                try {
                    const data = JSON.parse(e.newValue);
                    if (data && data.text) {
                        addChatMessage(data.sender, data.text);
                    }
                } catch(err) {}
            }
        });

        function syncPeerData() {
            if (!currentRoom || !userMarker) return;
            const myPos = userMarker.getLatLng();
            localStorage.setItem('reberai_pos_' + currentRoom, JSON.stringify({ lat: myPos.lat, lng: myPos.lng, time: Date.now() }));

            // فحص موقع الصديق
            const friendDataStr = localStorage.getItem('reberai_friend_pos_' + currentRoom);
            if (friendDataStr) {
                try {
                    const fPos = JSON.parse(friendDataStr);
                    if (fPos && fPos.lat && fPos.lng) {
                        if (friendMarker) {
                            friendMarker.setLatLng([fPos.lat, fPos.lng]);
                        } else {
                            friendMarker = L.circleMarker([fPos.lat, fPos.lng], {
                                radius: 9,
                                color: '#ffffff',
                                weight: 2,
                                fillColor: '#dc2626',
                                fillOpacity: 1
                            }).addTo(map).bindPopup('موقع صديقك الان');
                        }
                    }
                } catch(err) {}
            }
        }

        // تحديث موقعك باستمرار للطرف الآخر
        setInterval(() => {
            if (currentRoom && userMarker) {
                const pos = userMarker.getLatLng();
                localStorage.setItem('reberai_friend_pos_' + currentRoom, JSON.stringify({ lat: pos.lat, lng: pos.lng }));
            }
        }, 2000);

        function addWaypoint(lat, lng, name = `وجهة ${waypoints.length + 1}`) {
            waypoints.push({ lat, lng, name });
            const marker = L.marker([lat, lng]).addTo(map).bindPopup(name);
            waypointMarkers.push(marker);
            calculateRoute();
        }

        function clearWaypoints() {
            waypoints = [];
            waypointMarkers.forEach(m => map.removeLayer(m));
            waypointMarkers = [];
            if (routeLine) map.removeLayer(routeLine);
            document.getElementById('routeInfo').innerText = 'المسافة والوقت: تم مسح جميع الوجهات.';
        }

        function setMode(mode) {
            currentMode = mode;
            ['Car', 'Walk', 'Bike'].forEach(m => {
                document.getElementById('mode' + m).className = 'btn ' + (m.toLowerCase() === mode ? '' : 'btn-secondary');
            });
            if (waypoints.length > 0) calculateRoute();
        }

        function calculateRoute() {
            if (waypoints.length === 0) return;
            if (!userMarker) {
                alert('يرجى تحديد موقعك الحالي (GPS) أولاً.');
                return;
            }
            const startLatLng = userMarker.getLatLng();
            let coordsString = `${startLatLng.lng},${startLatLng.lat};`;
            waypoints.forEach(wp => {
                coordsString += `${wp.lng},${wp.lat};`;
            });
            coordsString = coordsString.slice(0, -1);

            let profile = 'driving';
            if (currentMode === 'walk') profile = 'walking';
            if (currentMode === 'bike') profile = 'cycling';

            const url = `https://router.project-osrm.org/route/v1/${profile}/${coordsString}?overview=full&geometries=geojson&alternatives=true`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data.routes && data.routes.length > 0) {
                        const route = data.routes[0];
                        const distanceMeters = route.distance;
                        const durationSec = route.duration;
                        
                        let distText = distanceMeters > 1000 ? (distanceMeters / 1000).toFixed(2) + ' كم' : Math.round(distanceMeters) + ' متر';
                        let durText = Math.round(durationSec / 60) + ' دقيقة';
                        
                        document.getElementById('routeInfo').innerHTML = `<b>مسافة الطريق الفعلية:</b> ${distText}<br><b>الوقت المقدر (${currentMode}):</b> ${durText}`;

                        if (routeLine) map.removeLayer(routeLine);
                        
                        const latlngs = route.geometry.coordinates.map(c => [c[1], c[0]]);
                        routeLine = L.polyline(latlngs, { color: '#2563eb', weight: 6, opacity: 0.85 }).addTo(map);
                    }
                })
                .catch(err => {
                    console.error('خطأ في حساب المسار:', err);
                });
        }

        function fetchPOIs(type) {
            if (!userMarker) {
                alert('حدد موقعك الحالي (GPS) أولاً لنتمكن من جلب الأقرب إليك بدقة.');
                return;
            }
            const center = userMarker.getLatLng();
            let queryTag = '';
            if (type === 'fuel') queryTag = 'amenity=fuel';
            else if (type === 'pharmacy') queryTag = 'amenity=pharmacy';
            else if (type === 'clinic') queryTag = 'amenity=clinic';
            else if (type === 'gov_hospital') queryTag = 'amenity=hospital';
            else if (type === 'private_hospital') queryTag = 'amenity=hospital';
            else if (type === 'restaurant') queryTag = 'amenity=restaurant';
            else if (type === 'mosque') queryTag = 'amenity=place_of_worship';
            else if (type === 'market_mall') queryTag = 'shop=supermarket';
            else if (type === 'shop_special') queryTag = 'shop';

            const query = `[out:json][timeout:25];(node["${queryTag.split('=')[0]}"](around:5000,${center.lat},${center.lng}););out body;`;
            const url = `https://overpass-api.de/api/interpreter?data=` + encodeURIComponent(query);

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data.elements) {
                        data.elements.slice(0, 10).forEach(el => {
                            if (el.lat && el.lon) {
                                const name = el.tags.name || type;
                                L.marker([el.lat, el.lon]).addTo(map).bindPopup(`${name} (${type})`);
                            }
                        });
                        alert(`تم جلب أقرب ${type} وعرضها على الخريطة بدقة تامة.`);
                    }
                })
                .catch(err => alert('خطأ في الاتصال بالخادم.'));
        }

        function searchPlace() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=` + encodeURIComponent(query))
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);
                        map.setView([lat, lon], 16);
                        addWaypoint(lat, lon, data[0].display_name);
                    } else {
                        alert('لم يتم العثور على المكان بدقة.');
                    }
                });
        }

        function saveOfflineTiles() {
            if ('caches' in window) {
                caches.open('reberai-osm-tiles-v2').then(() => {
                    alert('تم حفظ الخريطة وبلاطاتها بنجاح للعمل بدون إنترنت!');
                });
            } else {
                alert('متصفحك لا يدعم تخزين الكاش.');
            }
        }

        function togglePanel() {
            const panel = document.getElementById('controlPanel');
            panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
        }

        window.onload = initMap;
    </script>
</body>
</html>
